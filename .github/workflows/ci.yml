name: CI

# Compila e roda a suíte de testes contra um PostgreSQL descartável. O Render
# só publica depois que este workflow passar (autoDeployTrigger: checksPass
# no render.yaml).
on:
    push:
        branches: [development, main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: crashmap
                    POSTGRES_PASSWORD: crashmap
                    POSTGRES_DB: crashmap
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U crashmap"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            NODE_ENV: test
            DATABASE_URL: postgresql://crashmap:crashmap@localhost:5432/crashmap?schema=public
            # Segredos só para o CI: o banco é descartável e nenhum token sai daqui.
            ACCESS_TOKEN_SECRET: ci-access-token-secret
            REFRESH_TOKEN_SECRET: ci-refresh-token-secret

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.7.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma client
              run: pnpm prisma:generate

            - name: Type check and build
              run: pnpm build

            - name: Apply migrations
              run: pnpm prisma migrate deploy

            - name: Test
              run: pnpm test
