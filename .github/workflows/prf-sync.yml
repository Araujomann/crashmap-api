name: Sync PRF accidents

# A PRF declara atualização mensal, mas não publica em dia fixo. A verificação
# é diária e barata: sem arquivo novo, nada é baixado nem gravado.
on:
    schedule:
        - cron: "17 9 * * *" # 06:17 em Brasília (o GitHub pode atrasar)
    workflow_dispatch:
        inputs:
            years:
                description: "Anos (ex.: 2026, 2025,2026 ou 2022-2026). Vazio = padrão."
                required: false
                default: ""
            force:
                description: "Reprocessar mesmo sem mudança no arquivo"
                type: boolean
                default: false
            dry_run:
                description: "Somente validar e comparar (não grava ocorrências)"
                type: boolean
                default: false

concurrency:
    group: prf-sync
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    sync:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
            # A validação de ambiente da API (src/shared/config/env.ts) exige
            # estas variáveis, mas a sincronização não emite tokens. Valores
            # fixos evitam copiar os segredos reais da API para o GitHub.
            ACCESS_TOKEN_SECRET: not-used-by-prf-sync
            REFRESH_TOKEN_SECRET: not-used-by-prf-sync
            PRF_SOURCE_URL: ${{ secrets.PRF_SOURCE_URL }}
            PRF_SOURCE_YEAR: ${{ vars.PRF_SOURCE_YEAR }}
            PRF_SYNC_YEARS: ${{ inputs.years || vars.PRF_SYNC_YEARS }}
            PRF_SYNC_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}

        steps:
            - name: Check configuration
              id: config
              run: |
                  if [ -z "$DATABASE_URL" ]; then
                      echo "::warning::Secret DATABASE_URL nao configurado; sincronizacao PRF ignorada."
                      echo "ready=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "ready=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Checkout
              if: steps.config.outputs.ready == 'true'
              uses: actions/checkout@v4

            - name: Setup pnpm
              if: steps.config.outputs.ready == 'true'
              uses: pnpm/action-setup@v4
              with:
                  version: 10.7.0

            - name: Setup Node.js
              if: steps.config.outputs.ready == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: Install dependencies
              if: steps.config.outputs.ready == 'true'
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma client
              if: steps.config.outputs.ready == 'true'
              run: pnpm prisma:generate

            - name: Type check
              if: steps.config.outputs.ready == 'true'
              run: pnpm build

            - name: Synchronize PRF
              if: steps.config.outputs.ready == 'true'
              run: |
                  args=""
                  if [ "${{ inputs.force }}" = "true" ]; then args="$args --force"; fi
                  if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
                  pnpm sync:prf $args
